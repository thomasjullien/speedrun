# Race Timer under https://www.imoca.tech/speedrun/
#
# Paste these two blocks INSIDE the existing `server { ... }` block that already
# serves www.imoca.tech over TLS. Nothing else in that file needs to change.

# The app uses relative URLs, so it must always be reached with a trailing
# slash. This redirect makes /speedrun behave like /speedrun/.
location = /speedrun {
    return 301 /speedrun/;
}

location /speedrun/ {
    # The trailing slash on proxy_pass strips the /speedrun/ prefix, so the
    # Node server keeps serving /, /api/state, ... unaware of the sub-path.
    proxy_pass http://127.0.0.1:8090/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/stream is a Server-Sent Events connection: it must stay open and
    # unbuffered, otherwise the two posts stop seeing each other live.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;

    # Unlisted page: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Shared password for both posts. Create the file first, otherwise nginx
    # refuses to start:  htpasswd -c /etc/nginx/.htpasswd-speedrun timing
    auth_basic           "Race Timer";
    auth_basic_user_file /etc/nginx/.htpasswd-speedrun;
}
